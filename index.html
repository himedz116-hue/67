    .profile-3d-ring {

      background: linear-gradient(to bottom, transparent, rgba(212, 168, 74, 0.2), transparent);
      height: 20%;
      width: 100%;
      top: -20%;
      animation: scan 3s linear infinite;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes scan {
      0% {
        top: -20%;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        top: 100%;
        opacity: 0;
      }
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .tech-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: #D4A84A;
      opacity: 0.6;
      z-index: 25;
    }

    .tech-corner-tl {
      top: -5px;
      left: -5px;
      border-top-width: 2px;
      border-left-width: 2px;
    }

    .tech-corner-tr {
      top: -5px;
      right: -5px;
      border-top-width: 2px;
      border-right-width: 2px;
    }

    .tech-corner-bl {
      bottom: -5px;
      left: -5px;
      border-bottom-width: 2px;
      border-left-width: 2px;
    }

    .tech-corner-br {
      bottom: -5px;
      right: -5px;
      border-bottom-width: 2px;
      border-right-width: 2px;
    }

    .glitch-active {
      animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both infinite;
      filter: brightness(1.2) contrast(1.2);
    }

    /* TMNAA Fire ember particles */
    .fire-particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #D4A84A;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: ember-rise 4s ease-out infinite;
      opacity: 0;
    }

    @keyframes ember-rise {
      0% { opacity: 0; transform: translateY(100vh) scale(0); }
      10% { opacity: 0.8; }
      90% { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(-20vh) scale(1.5); }
    }

    /* Gold selection */
    ::selection {
      background-color: rgba(212, 168, 74, 0.3);
      color: #fff;
    }

    /* Smooth scroll */
    html {
      scroll-behavior: smooth;
    }

    /* Custom gradient text */
    .text-fire-gradient {
      background: linear-gradient(135deg, #D4A84A, #FF6B00, #D4A84A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .dragon-scale-pattern {
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(212, 168, 74, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 107, 0, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(212, 168, 74, 0.04) 0%, transparent 70%);
      background-size: 60px 60px, 80px 80px, 100px 100px;
      animation: dragon-scale 4s ease-in-out infinite;
    }

    .holographic {
      position: relative;
      overflow: hidden;
    }
    .holographic::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(212, 168, 74, 0.1) 40%,
        rgba(255, 107, 0, 0.15) 50%,
        rgba(212, 168, 74, 0.1) 60%,
        transparent 70%
      );
      animation: crystal-shine 3s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }

    .crystal-refraction {
      position: relative;
      overflow: hidden;
    }
    .crystal-refraction::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.1) 0%,
        transparent 40%,
        rgba(212, 168, 74, 0.15) 60%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 1;
      animation: crystal-shine 2.5s ease-in-out infinite;
    }

      text-shadow: 
        0 0 5px #D4A84A,
        0 0 10px #D4A84A,
        0 0 20px #FF6B00,
        0 0 40px #FF6B00,
        0 0 80px #D4A84A;
      animation: neon-pulse 1.5s ease-in-out infinite;
    }

      position: relative;
      border-radius: 1rem;
      overflow: hidden;
    }

      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, #D4A84A, #FF6B00, #FFF8DC, #FF6B00, #D4A84A);

      animation: gradient-x 3s ease infinite;
      z-index: -1;
      border-radius: inherit;
    }
    .animated-border::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: #0a0a0a;
      border-radius: inherit;
      z-index: -1;
    }

    .particle-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    }

      right: 0;

      border-radius: 2px;

    .fire-trail::before {
